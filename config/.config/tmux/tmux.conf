# Dont forget to "<prefix> I" babe
set -g prefix C-s
set -ga terminal-overrides ",*-256color*:Tc"
set-window-option -g mode-keys vi
set -g mouse off
set -g base-index 1

# Plugin init
set -g @plugin "tmux-plugins/tpm"

# Status line
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g status-right "#[fg=black,bg=red]  #($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load -m2 -a0 -g0 -t0)  #[default]#[fg=black,bg=blue]"

# Themes
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'

# "Reload" key bind
bind r source-file ~/.config/tmux/tmux.conf

unbind -n C-n
unbind -n C-l
unbind -n C-w
unbind x
unbind -n C-h
unbind t
unbind -n C-j
unbind -n C-k

bind-key -n C-l next-window
bind-key -n C-h previous-window

bind-key n new-window -c "#{pane_current_path}"
bind-key t split-window -h  -c "#{pane_current_path}"
bind-key x if-shell "[[ \$(tmux list-panes | wc -l) -gt 1 ]]" "kill-pane"
bind-key w kill-window

bind-key j select-pane -L
bind-key k select-pane -R


run "~/.config/tmux/plugins/tpm/tpm"
